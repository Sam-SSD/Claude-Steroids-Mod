name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --version
          node --check setup/setup.mjs
          node --check setup/toggle.js
          node --check bench/compress-json.mjs
          node --check assets/render.mjs
      - name: Smoke test (switch + installer against a mock gateway)
        run: node test/smoke.mjs
